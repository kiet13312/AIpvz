name: Build Garden Defense

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Re-encode video for Android compatibility
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -y -i app/src/main/res/raw/win.mp4 -map 0:v:0 -map 0:a:0? -c:v libx264 -profile:v baseline -level 3.0 -pix_fmt yuv420p -preset veryfast -crf 24 -c:a aac -b:a 96k -movflags +faststart /tmp/win-android.mp4
          mv /tmp/win-android.mp4 app/src/main/res/raw/win.mp4

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GardenDefense-updated-APK
          path: app/build/outputs/apk/debug/*.apk
