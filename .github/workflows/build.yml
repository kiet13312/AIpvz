name: Build Garden Defense

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply verified gameplay fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/alpvz/gardendefense/MainActivity.java')
          s=p.read_text(encoding='utf-8')

          def replace_once(old,new,label):
              global s
              if old not in s:
                  raise SystemExit(f'MISSING: {label}')
              s=s.replace(old,new,1)

          # Keep the shovel clear of the BINU card and keep touch area identical.
          replace_once('''                    getWidth() * .465f,
                    getHeight() * .075f,
                    getWidth() * .525f,
                    getHeight() * .15f,''','''                    getWidth() * .82f,
                    getHeight() * .075f,
                    getWidth() * .87f,
                    getHeight() * .15f,''','shovel draw')
          replace_once('getWidth() * .495f,\n                    getHeight() * .122f,','getWidth() * .845f,\n                    getHeight() * .122f,','shovel label')
          replace_once('inside(x, y, .465f, .075f, .525f, .15f)','inside(x, y, .82f, .075f, .87f, .15f)','shovel touch')

          # Correct BINU movement: it travels to the zombie instead of animating in place.
          if 'float binuTargetX = 0f;' not in s:
              replace_once('''        boolean binuSound1Finished = false;

        MediaPlayer binuSound1Player;''','''        boolean binuSound1Finished = false;
        float binuX = 0f;
        float binuY = 0f;
        float binuStartX = 0f;
        float binuStartY = 0f;
        float binuTargetX = 0f;
        float binuTargetY = 0f;

        MediaPlayer binuSound1Player;''','BINU state')

          old_draw='''        private void drawBinu(Canvas c) {
            if (!binuWaiting && !binuJumping) return;
            if (binuRow < 0 || binuCol < 0) return;

            Bitmap b = binuImg;

            if (binuJumping) {
                if (binuFrame == 1) b = binu1Img;
                else if (binuFrame == 2) b = binu2Img;
                else if (binuFrame == 3) b = binu3Img;
                else if (binuFrame == 4) b = binu4Img;
            }

            if (b == null) return;

            float x = left + binuCol * cellW + cellW / 2f;
            float y = top + binuRow * cellH + cellH / 2f;

            c.drawBitmap(
                    b,
                    null,
                    new RectF(
                            x - cellW * .37f,
                            y - cellH * .42f,
                            x + cellW * .37f,
                            y + cellH * .42f
                    ),
                    p
            );
        }
'''
          new_draw='''        private void drawBinu(Canvas c) {
            if (!binuWaiting && !binuJumping) return;
            if (binuRow < 0 || binuCol < 0) return;

            Bitmap b = binuImg;
            if (binuJumping) {
                if (binuFrame == 1) b = binu1Img;
                else if (binuFrame == 2) b = binu2Img;
                else if (binuFrame == 3) b = binu3Img;
                else if (binuFrame >= 4) b = binu4Img;
            }
            if (b == null) return;

            float x = binuJumping ? binuX : left + binuCol * cellW + cellW / 2f;
            float y = binuJumping ? binuY : top + binuRow * cellH + cellH / 2f;

            c.drawBitmap(b, null,
                    new RectF(x - cellW * .37f, y - cellH * .42f,
                            x + cellW * .37f, y + cellH * .42f), p);
        }
'''
          replace_once(old_draw,new_draw,'BINU draw')

          start='        private void updateBinu(long now) {'
          end='        private void updatePeas(float dt) {'
          a=s.index(start)
          b=s.index(end,a)
          new_logic='''        private void updateBinu(long now) {
            if (binuWaiting && !binuJumping && now >= binuDetectAt && binuSound1Finished) {
                startBinuJump(now);
            }
            if (!binuJumping) return;

            long elapsed = now - binuClock;
            float t = Math.max(0f, Math.min(1f, elapsed / 480f));
            float smooth = t * t * (3f - 2f * t);
            binuX = binuStartX + (binuTargetX - binuStartX) * smooth;
            binuY = binuStartY + (binuTargetY - binuStartY) * smooth;
            binuFrame = Math.max(1, Math.min(4, (int)(elapsed / 120L) + 1));

            if (elapsed >= 480L) {
                binuX = binuTargetX;
                binuY = binuTargetY;
                smashBinu();
                binuJumping = false;
                binuWaiting = false;
                binuFrame = 0;
                binuRow = -1;
                binuCol = -1;
            }
        }

        private void checkBinu(long now) {
            if (binuWaiting || binuJumping) return;
            for (int r = 0; r < ROWS; r++) {
                for (int col = 0; col < COLS; col++) {
                    Plant a = plants[r][col];
                    if (a == null || a.type != BINU) continue;
                    float bx = left + col * cellW + cellW / 2f;
                    Zombie nearest = null;
                    float best = Float.MAX_VALUE;
                    for (Zombie z : zombies) {
                        if (z.hp <= 0 || z.row != r || z.x <= bx) continue;
                        float d = z.x - bx;
                        if (d <= cellW * 1.30f && d < best) {
                            nearest = z;
                            best = d;
                        }
                    }
                    if (nearest != null) {
                        binuRow = r;
                        binuCol = col;
                        binuWaiting = true;
                        binuDetectAt = now + 2000L;
                        binuX = bx;
                        binuY = top + r * cellH + cellH / 2f;
                        return;
                    }
                }
            }
        }

        private void startBinuJump(long now) {
            if (!binuWaiting || binuRow < 0 || binuCol < 0) return;
            float startX = left + binuCol * cellW + cellW / 2f;
            float startY = top + binuRow * cellH + cellH / 2f;
            Zombie target = null;
            float best = Float.MAX_VALUE;
            for (Zombie z : zombies) {
                if (z.hp <= 0 || z.row != binuRow || z.x < startX) continue;
                float d = z.x - startX;
                if (d <= cellW * 1.80f && d < best) {
                    target = z;
                    best = d;
                }
            }
            if (target == null) {
                binuWaiting = false;
                return;
            }
            binuStartX = startX;
            binuStartY = startY;
            binuTargetX = target.x;
            binuTargetY = target.y;
            binuX = startX;
            binuY = startY;
            plants[binuRow][binuCol] = null;
            binuJumping = true;
            binuFrame = 1;
            binuClock = now;
            playBinuSound2();
        }

        private void smashBinu() {
            if (binuRow < 0) return;
            float centerX = binuTargetX;
            float range = cellW * 1.25f;
            for (Zombie z : zombies) {
                if (z.hp <= 0 || z.row != binuRow) continue;
                if (Math.abs(z.x - centerX) <= range) {
                    if (z.boss) z.hp = Math.max(1f, z.hp * .50f);
                    else z.hp = 0;
                }
            }
        }

'''
          s=s[:a]+new_logic+s[b:]

          # Do not render the planted BINU twice while it is waiting for its jump.
          old='''                    Plant plant = plants[r][col];
                    if (plant == null) continue;'''
          if 'if (plant.type == BINU && binuWaiting) continue;' not in s:
              replace_once(old,old+'\n                    if (plant.type == BINU && binuWaiting) continue;','BINU duplicate draw guard')

          # Reset BINU movement state each time a level starts.
          replace_once('''            binuSound1Finished = false;
            stopBinuSound1();''','''            binuSound1Finished = false;
            binuX = binuY = 0f;
            binuStartX = binuStartY = 0f;
            binuTargetX = binuTargetY = 0f;
            stopBinuSound1();''','BINU reset')

          # Plant Food: consume exactly once and reduce only non-boss zombie HP to 2/3.
          old_food='''            playPlantFoodSound();

            if (a.type == GIGANUT) {'''
          new_food='''            playPlantFoodSound();

            for (Zombie z : zombies) {
                if (z.hp > 0 && !z.boss) {
                    z.hp = Math.max(1f, z.hp * (2f / 3f));
                }
            }

            if (a.type == GIGANUT) {'''
          replace_once(old_food,new_food,'Plant Food zombie reduction')
          replace_once('''                    if (plants[row][col] != null &&
                            plants[row][col].type != BINU &&
                            food > 0) {
                        usePlantFood(plants[row][col]);
                        food--;
                    }''','''                    if (plants[row][col] != null &&
                            plants[row][col].type != BINU &&
                            food > 0) {
                        usePlantFood(plants[row][col]);
                    }''','Plant Food double consume')

          # Repeater second shot must be delayed by exactly 0.5 seconds.
          replace_once('fireDelayed(r, col, 30, 250);','fireDelayed(r, col, 30, 500);','Repeater 0.5s delay')

          # Level row layout: level 1 = center row only, levels 2-3 = 3 rows, level 4+ = all 5.
          if 'private int activeRows()' not in s:
              anchor='''        private long spawnDelay() {
'''
              helpers='''        private int activeRows() {
            if (level == 1) return 1;
            if (level <= 3) return 3;
            return 5;
        }

        private boolean activeRow(int row) {
            int n = activeRows();
            int start = (ROWS - n) / 2;
            return row >= start && row < start + n;
        }

        private long spawnDelay() {
'''
              replace_once(anchor,helpers,'active row helpers')

          replace_once('''            int row = random.nextInt(ROWS);

            boolean boss =''','''            int rowCount = activeRows();
            int firstRow = (ROWS - rowCount) / 2;
            int row = firstRow + random.nextInt(rowCount);

            boolean boss =''','spawn only active rows')

          replace_once('''                    c.drawRect(
                            left + col * cellW,
                            top + r * cellH,
                            left + (col + 1) * cellW,
                            top + (r + 1) * cellH,
                            p
                    );''','''                    if (!activeRow(r)) {
                        p.setColor(Color.rgb(70, 105, 60));
                    }
                    c.drawRect(
                            left + col * cellW,
                            top + r * cellH,
                            left + (col + 1) * cellW,
                            top + (r + 1) * cellH,
                            p
                    );''','inactive row board visual')

          replace_once('''                int col = (int) ((x - left) / cellW);
                int row = (int) ((y - top) / cellH);

                if (row < 0 || row >= ROWS ||
                        col < 0 || col >= COLS) {''','''                int col = (int) ((x - left) / cellW);
                int row = (int) ((y - top) / cellH);

                if (row < 0 || row >= ROWS ||
                        col < 0 || col >= COLS) {''','board coordinates')
          if 'if (!activeRow(row))' not in s[s.index('// Board'):s.index('        private boolean inside')]:
              marker='''                if (row < 0 || row >= ROWS ||
                        col < 0 || col >= COLS) {
                    return true;
                }

                if (tool == TOOL_SHOVEL) {'''
              replace_once(marker,'''                if (row < 0 || row >= ROWS ||
                        col < 0 || col >= COLS) {
                    return true;
                }
                if (!activeRow(row)) return true;

                if (tool == TOOL_SHOVEL) {''','prevent inactive row planting')

          # Zombie speed: reduce existing non-boss speeds by one third; boss keeps its own lower speed.
          replace_once('speed = cellW * .12f;','speed = cellW * .08f;','zombie type 1 speed')
          replace_once('speed = cellW * .30f;','speed = cellW * .20f;','zombie type 2 speed')
          replace_once('speed = cellW * .19f;','speed = cellW * .1267f;','normal zombie speed')
          replace_once('speed = cellW * .08f;\n                    damage = 45;','speed = cellW * .0533f;\n                    damage = 45;','boss speed')

          # Mower: draw a simple mower body, two wheels and handle instead of a red rectangle.
          old_mower='''        private void drawMowers(Canvas c) {
            for (Mower m : mowers) {
                float y = top + m.row * cellH + cellH * .72f;

                p.setColor(
                        m.used
                                ? Color.DKGRAY
                                : Color.rgb(190, 70, 40)
                );

                c.drawRoundRect(
                        m.x - cellW * .30f,
                        y - cellH * .18f,
                        m.x + cellW * .30f,
                        y,
                        8,
                        8,
                        p
                );
            }
        }
'''
          new_mower='''        private void drawMowers(Canvas c) {
            for (Mower m : mowers) {
                float y = top + m.row * cellH + cellH * .72f;
                p.setColor(m.used ? Color.DKGRAY : Color.rgb(60, 125, 65));
                c.drawRoundRect(
                        m.x - cellW * .25f,
                        y - cellH * .16f,
                        m.x + cellW * .25f,
                        y,
                        8, 8, p);
                p.setColor(Color.DKGRAY);
                c.drawCircle(m.x - cellW * .16f, y, cellH * .055f, p);
                c.drawCircle(m.x + cellW * .16f, y, cellH * .055f, p);
                p.setColor(Color.DKGRAY);
                p.setStrokeWidth(Math.max(4f, cellW * .035f));
                c.drawLine(m.x + cellW * .18f, y - cellH * .10f,
                        m.x + cellW * .38f, y - cellH * .34f, p);
            }
        }
'''
          replace_once(old_mower,new_mower,'mower drawing')

          # Guard against an unused BINU animation loop regression.
          replace_once('''                        if (a.animFrame > 10) {
                            a.animFrame = 1;
                        }''','''                        if (a.animFrame > 10) {
                            a.animFrame = 0;
                        }''','Peashooter animation end')

          p.write_text(s,encoding='utf-8')
          PY

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses || true

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Commit fixed source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/alpvz/gardendefense/MainActivity.java
          if git diff --cached --quiet; then echo 'Source already fixed'; else git commit -m 'Fix gameplay balance and level layout'; git push; fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GardenDefense-APK
          path: app/build/outputs/apk/debug/*.apk
