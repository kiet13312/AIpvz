name: Build Garden Defense

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Verify compressed GameView source
        run: |
          python3 - <<'PY'
          import pathlib
          import zlib

          path = pathlib.Path("app/src/main/java/com/alpvz/gardendefense/GameView.java.gz")
          archive = path.read_bytes()
          if len(archive) < 18 or archive[:3] != b"\x1f\x8b\x08" or archive[3] != 0:
              raise SystemExit("Invalid or unsupported GameView GZIP header")

          inflater = zlib.decompressobj(-zlib.MAX_WBITS)
          source = inflater.decompress(archive[10:-8]) + inflater.flush()
          if not inflater.eof:
              raise SystemExit("GameView DEFLATE stream is incomplete")
          if not source.startswith(b"package com.alpvz.gardendefense;") or b"class GameView" not in source:
              raise SystemExit("Restored GameView source failed validation")

          print(f"Restored GameView bytes: {len(source)}")
          PY

      - name: Build APK
        shell: bash
        run: |
          set +e
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle-build.log"
          result=${PIPESTATUS[0]}
          exit "$result"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GardenDefense-Build-Log
          path: ${{ runner.temp }}/gradle-build.log
          if-no-files-found: warn

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GardenDefense-APK
          path: app/build/outputs/apk/debug/*.apk
