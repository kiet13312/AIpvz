name: Apply MainActivity fixes

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  fix-main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch MainActivity.java
        shell: python
        run: |
          from pathlib import Path

          path = Path('app/src/main/java/com/alpvz/gardendefense/MainActivity.java')
          s = path.read_text(encoding='utf-8')

          replacements = [
              # Shovel: move it to a free toolbar slot to the right of Plant Food.
              ('button(c, .91f, .075f, .99f, .15f, speed == 2 ? "×2" : "▶");\n'
               '            button(c, .82f, .075f, .90f, .15f, "Ⅱ");',
               'button(c, .94f, .075f, .99f, .15f, speed == 2 ? "×2" : "▶");\n'
               '            button(c, .88f, .075f, .93f, .15f, "Ⅱ");'),
              ('if (inside(x, y, .82f, .075f, .90f, .15f)) {',
               'if (inside(x, y, .88f, .075f, .93f, .15f)) {'),
              ('if (inside(x, y, .91f, .075f, .99f, .15f)) {',
               'if (inside(x, y, .94f, .075f, .99f, .15f)) {'),
              # Peashooter: play frames 1..10 once for every shot, then return to static frame.
              ('if (a.animFrame > 10) {\n'
               '                            a.animFrame = 1;\n'
               '                        }',
               'if (a.animFrame > 10) {\n'
               '                            a.animFrame = 0;\n'
               '                        }'),
          ]

          for old, new in replacements:
              if old not in s:
                  raise SystemExit('Expected code block not found; refusing to modify MainActivity.java')
              s = s.replace(old, new, 1)

          # Guard against accidentally duplicating the changes.
          if s.count('button(c, .94f, .075f, .99f, .15f, speed == 2 ? "×2" : "▶");') != 1:
              raise SystemExit('Unexpected shovel/speed button count')
          if s.count('a.animFrame = 0;') < 1:
              raise SystemExit('Peashooter animation reset was not applied')

          path.write_text(s, encoding='utf-8')

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/alpvz/gardendefense/MainActivity.java
          if git diff --cached --quiet; then
            echo "No MainActivity changes needed."
          else
            git commit -m "Fix shovel position and Peashooter animation"
            git push
          fi
