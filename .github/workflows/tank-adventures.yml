name: Build Tank Adventures APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'tank-adventures/**'
      - '.github/workflows/tank-adventures.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle -p tank-adventures assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tank-Adventures-debug
          path: tank-adventures/app/build/outputs/apk/debug/app-debug.apk
