name: Fix current gameplay bugs

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-current-bugs.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch MainActivity.java
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/alpvz/gardendefense/MainActivity.java')
          s = p.read_text(encoding='utf-8')

          # Shovel: move from the BINU card position to its own slot.
          s = s.replace('getWidth() * .465f,', 'getWidth() * .82f,', 1)
          s = s.replace('getWidth() * .525f,', 'getWidth() * .87f,', 1)
          s = s.replace('getWidth() * .495f,', 'getWidth() * .845f,', 1)

          # BINU real jump position state.
          old = 'boolean binuSound1Finished = false;\n\n        MediaPlayer binuSound1Player;'
          new = '''boolean binuSound1Finished = false;
        float binuX = 0f;
        float binuY = 0f;
        float binuStartX = 0f;
        float binuStartY = 0f;
        float binuTargetX = 0f;
        float binuTargetY = 0f;

        MediaPlayer binuSound1Player;'''
          if old not in s:
              raise SystemExit('BINU state anchor not found')
          s = s.replace(old, new, 1)

          start = s.index('        private void drawBinu(Canvas c) {')
          end = s.index('        private void playBinuSound1() {', start)
          s = s[:start] + '''        private void drawBinu(Canvas c) {
            if (!binuWaiting && !binuJumping) return;
            if (binuRow < 0 || binuCol < 0) return;

            Bitmap b = binuImg;
            if (binuJumping) {
                if (binuFrame == 1) b = binu1Img;
                else if (binuFrame == 2) b = binu2Img;
                else if (binuFrame == 3) b = binu3Img;
                else if (binuFrame >= 4) b = binu4Img;
            }
            if (b == null) return;

            float x = binuJumping ? binuX : left + binuCol * cellW + cellW / 2f;
            float y = binuJumping ? binuY : top + binuRow * cellH + cellH / 2f;

            c.drawBitmap(b, null,
                    new RectF(x - cellW * .37f, y - cellH * .42f,
                            x + cellW * .37f, y + cellH * .42f), p);
        }

''' + s[end:]

          start = s.index('        private void updateBinu(long now) {')
          end = s.index('        private void updatePeas(float dt) {', start)
          s = s[:start] + '''        private void updateBinu(long now) {
            if (binuWaiting && !binuJumping &&
                    now >= binuDetectAt && binuSound1Finished) {
                startBinuJump(now);
            }

            if (!binuJumping) return;

            long elapsed = now - binuClock;
            float t = Math.max(0f, Math.min(1f, elapsed / 480f));
            float smooth = t * t * (3f - 2f * t);

            binuX = binuStartX + (binuTargetX - binuStartX) * smooth;
            binuY = binuStartY + (binuTargetY - binuStartY) * smooth;
            binuFrame = Math.max(1, Math.min(4, (int)(elapsed / 120L) + 1));

            if (elapsed >= 480L) {
                binuX = binuTargetX;
                binuY = binuTargetY;
                smashBinu();
                binuJumping = false;
                binuWaiting = false;
                binuFrame = 0;
                binuRow = -1;
                binuCol = -1;
            }
        }

        private void checkBinu(long now) {
            if (binuWaiting || binuJumping) return;

            for (int r = 0; r < ROWS; r++) {
                for (int col = 0; col < COLS; col++) {
                    Plant a = plants[r][col];
                    if (a == null || a.type != BINU) continue;

                    float bx = left + col * cellW + cellW / 2f;
                    Zombie nearest = null;
                    float best = Float.MAX_VALUE;

                    for (Zombie z : zombies) {
                        if (z.hp <= 0 || z.row != r || z.x <= bx) continue;
                        float d = z.x - bx;
                        if (d <= cellW * 1.30f && d < best) {
                            nearest = z;
                            best = d;
                        }
                    }

                    if (nearest != null) {
                        binuRow = r;
                        binuCol = col;
                        binuWaiting = true;
                        binuDetectAt = now + 2000L;
                        binuX = bx;
                        binuY = top + r * cellH + cellH / 2f;
                        return;
                    }
                }
            }
        }

        private void startBinuJump(long now) {
            if (!binuWaiting || binuRow < 0 || binuCol < 0) return;

            float startX = left + binuCol * cellW + cellW / 2f;
            float startY = top + binuRow * cellH + cellH / 2f;
            Zombie target = nearestZombie(binuRow, binuCol, cellW * 1.80f);

            if (target == null || target.hp <= 0) {
                binuWaiting = false;
                return;
            }

            binuStartX = startX;
            binuStartY = startY;
            binuTargetX = target.x;
            binuTargetY = target.y;
            binuX = startX;
            binuY = startY;

            plants[binuRow][binuCol] = null;
            binuJumping = true;
            binuFrame = 1;
            binuClock = now;
            playBinuSound2();
        }

        private void smashBinu() {
            if (binuRow < 0) return;

            float centerX = binuTargetX;
            float range = cellW * 1.25f;

            for (Zombie z : zombies) {
                if (z.hp <= 0 || z.row != binuRow) continue;
                if (Math.abs(z.x - centerX) <= range) {
                    if (z.boss) z.hp = Math.max(1f, z.hp * .50f);
                    else z.hp = 0;
                }
            }
        }

''' + s[end:]

          # Shovel touch: process before the plant-card loop.
          anchor = '            // Plant cards\n            float cardY = getHeight() * .075f;'
          replacement = '''            // Shovel
            if (inside(x, y, .82f, .075f, .87f, .15f)) {
                tool = tool == TOOL_SHOVEL ? TOOL_NONE : TOOL_SHOVEL;
                invalidate();
                return true;
            }

            // Plant cards
            float cardY = getHeight() * .075f;'''
          if anchor not in s:
              raise SystemExit('Touch anchor not found')
          s = s.replace(anchor, replacement, 1)

          old_reset = '            binuSound1Finished = false;\n            stopBinuSound1();'
          new_reset = '''            binuSound1Finished = false;
            binuX = binuY = 0f;
            binuStartX = binuStartY = 0f;
            binuTargetX = binuTargetY = 0f;
            stopBinuSound1();'''
          if old_reset not in s:
              raise SystemExit('BINU reset anchor not found')
          s = s.replace(old_reset, new_reset, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('app/src/main/java/com/alpvz/gardendefense/MainActivity.java').read_text(encoding='utf-8')
          checks = [
              'getWidth() * .82f',
              'float binuTargetX = 0f;',
              'elapsed >= 480L',
              'float x = binuJumping ? binuX',
              'tool = tool == TOOL_SHOVEL ? TOOL_NONE : TOOL_SHOVEL;'
          ]
          for x in checks:
              assert x in s, x
          assert s.count('private void drawBinu(Canvas c) {') == 1
          assert s.count('private void updateBinu(long now) {') == 1
          assert s.count('private void smashBinu() {') == 1
          print('Source patch verification passed')
          PY

      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/alpvz/gardendefense/MainActivity.java
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Fix shovel interaction and BINU jump movement'
            git push
          fi
