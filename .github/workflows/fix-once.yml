name: Fix gameplay once

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[FIX-ONCE]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch and validate MainActivity
        run: |
          sed -i "s/'elapsed >= 480L', //" fix_once.py
          python3 fix_once.py

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses || true

      - name: Build fixed APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Commit fixed source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/alpvz/gardendefense/MainActivity.java
          git commit -m '[FIX-ONCE] Fix level rows, Plant Food, Peashooter, Repeater, zombies and mower'
          git push

      - name: Upload fixed APK
        uses: actions/upload-artifact@v4
        with:
          name: GardenDefense-FIXED-APK
          path: app/build/outputs/apk/debug/*.apk
