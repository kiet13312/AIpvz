name: Apply animation and final video fix

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch MainActivity.java
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/src/main/java/com/alpvz/gardendefense/MainActivity.java')
          s = p.read_text(encoding='utf-8')

          def once(old, new, label):
              global s
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {n}')
              s = s.replace(old, new)

          once('import android.widget.TextView;\n', 'import android.widget.TextView;\nimport android.widget.FrameLayout;\nimport android.widget.VideoView;\nimport android.net.Uri;\n', 'imports')
          once('    private SharedPreferences save;\n', '    private SharedPreferences save;\n    private FrameLayout root;\n    private VideoView winVideo;\n', 'fields')
          once('            game = new GameView();\n            setContentView(game);\n', '            game = new GameView();\n            root = new FrameLayout(MainActivity.this);\n            root.setBackgroundColor(Color.BLACK);\n            root.addView(game, new FrameLayout.LayoutParams(FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT));\n            setContentView(root);\n', 'root')
          once('    @Override\n    protected void onDestroy() {\n', '''    private void hideFinalVideo() {\n        try {\n            if (winVideo != null) {\n                winVideo.stopPlayback();\n                if (root != null) root.removeView(winVideo);\n                winVideo = null;\n            }\n        } catch (Exception ignored) {}\n    }\n\n    private void showFinalVideo() {\n        hideFinalVideo();\n        try {\n            if (root == null || game == null) return;\n            int id = getResources().getIdentifier("win", "raw", getPackageName());\n            if (id == 0) { game.invalidate(); return; }\n            winVideo = new VideoView(MainActivity.this);\n            winVideo.setBackgroundColor(Color.BLACK);\n            winVideo.setVideoURI(Uri.parse("android.resource://" + getPackageName() + "/" + id));\n            root.addView(winVideo, new FrameLayout.LayoutParams(FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT));\n            winVideo.setOnCompletionListener(mp -> { hideFinalVideo(); if (game != null) { game.screen = GameView.WIN; game.invalidate(); } });\n            winVideo.setOnErrorListener((mp, what, extra) -> { hideFinalVideo(); if (game != null) { game.screen = GameView.WIN; game.invalidate(); } return true; });\n            winVideo.start();\n        } catch (Exception ignored) { hideFinalVideo(); if (game != null) game.invalidate(); }\n    }\n\n    @Override\n    protected void onDestroy() {\n''', 'video methods')
          once('            if (game != null) {\n                game.releaseBinuSounds();\n            }\n', '            hideFinalVideo();\n            if (game != null) {\n                game.releaseBinuSounds();\n            }\n', 'video cleanup')
          once('                    if (plant.type == BINU && binuWaiting) continue;\n', '                    if (plant.type == BINU && (binuWaiting || binuJumping)) continue;\n', 'binu draw')
          old = '''        private void updatePlantAnimations(long now) {\n            for (int r = 0; r < ROWS; r++) {\n                for (int col = 0; col < COLS; col++) {\n                    Plant a = plants[r][col];\n                    if (a == null || a.type != PEASHOOTER) continue;\n\n                    if (a.animFrame > 0 && now - a.animClock >= 55) {\n                        a.animClock = now;\n                        a.animFrame++;\n\n                        if (a.animFrame > 10) {\n                            a.animFrame = 0;\n                        }\n                    }\n                }\n            }\n        }\n'''
          new = '''        private void updatePlantAnimations(long now) {\n            for (int r = 0; r < ROWS; r++) {\n                for (int col = 0; col < COLS; col++) {\n                    Plant a = plants[r][col];\n                    if (a == null || a.type != PEASHOOTER || peaAnim[0] == null) continue;\n                    if (a.animFrame < 1 || a.animFrame > 10) {\n                        a.animFrame = 1;\n                        a.animClock = now;\n                    } else if (now - a.animClock >= 70L) {\n                        a.animClock = now;\n                        a.animFrame++;\n                        if (a.animFrame > 10) a.animFrame = 1;\n                    }\n                }\n            }\n        }\n'''
          once(old, new, 'animation loop')
          once('                            a.last = now;\n                            a.animFrame = 1;\n                            a.animClock = now;\n', '                            a.last = now;\n                            if (a.animFrame < 1 || a.animFrame > 10) {\n                                a.animFrame = 1;\n                                a.animClock = now;\n                            }\n', 'fire animation')
          once('                    float bx = left + col * cellW + cellW / 2f;\n                    Zombie nearest = null;\n', '                    float bx = left + col * cellW + cellW / 2f;\n                    float by = top + r * cellH + cellH / 2f;\n                    Zombie nearest = null;\n', 'binu by')
          once('                        if (z.hp <= 0 || z.row != r || z.x <= bx) continue;\n                        float d = z.x - bx;\n', '                        if (z.hp <= 0 || z.row != r) continue;\n                        float d = Math.abs(z.x - bx);\n', 'binu both sides')
          once('                        binuY = top + r * cellH + cellH / 2f;\n', '                        binuY = by;\n', 'binu y')
          once('                if (z.hp <= 0 || z.row != binuRow || z.x < startX) continue;\n                float d = z.x - startX;\n', '                if (z.hp <= 0 || z.row != binuRow) continue;\n                float d = Math.abs(z.x - startX);\n', 'binu jump')
          once('            float range = cellW * 1.25f;\n', '            float range = cellW * 1.65f;\n', 'binu smash')
          once('                last = System.currentTimeMillis();\n\n                if (type == MINE) {\n', '                last = System.currentTimeMillis();\n\n                if (type == PEASHOOTER) {\n                    animFrame = 1;\n                    animClock = last;\n                }\n\n                if (type == MINE) {\n', 'initial animation')
          once('            saveGame();\n        }\n\n        private void usePlantFood', '            saveGame();\n            if (level == 9) postDelayed(() -> showFinalVideo(), 80L);\n        }\n\n        private void usePlantFood', 'win video call')
          p.write_text(s, encoding='utf-8')

      - name: Commit MainActivity changes and remove patch workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/alpvz/gardendefense/MainActivity.java
          git rm .github/workflows/fix_animation_and_win_video.yml
          git commit -m 'Fix Peashooter animation, BINU movement and level 9 video'
          git push origin HEAD:main
