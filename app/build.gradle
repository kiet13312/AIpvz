plugins {
    id 'com.android.application'
}

android {
    namespace 'com.alpvz.gardendefense'
    compileSdk 35

    defaultConfig {
        applicationId 'com.alpvz.gardendefense'
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName '0.3'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }

        release {
            minifyEnabled false
        }
    }
}

// Restore the compressed engine source before Java compilation.
// The archive has a damaged GZIP trailer, so inflate its DEFLATE payload
// and validate the actual Java source instead of trusting the trailer CRC.
def compressedGameView = file('src/main/java/com/alpvz/gardendefense/GameView.java.gz')
def restoredGameView = file('src/main/java/com/alpvz/gardendefense/GameView.java')

def restoreGameView = tasks.register('restoreGameView') {
    inputs.file(compressedGameView)
    outputs.file(restoredGameView)

    doLast {
        if (!compressedGameView.exists()) {
            throw new GradleException('Missing compressed GameView.java.gz')
        }

        byte[] archive = compressedGameView.bytes
        if (archive.length < 18 ||
                (archive[0] & 0xff) != 0x1f ||
                (archive[1] & 0xff) != 0x8b ||
                (archive[2] & 0xff) != 8 ||
                (archive[3] & 0xff) != 0) {
            throw new GradleException('GameView archive has an unsupported or invalid GZIP header')
        }

        def inflater = new java.util.zip.Inflater(true)
        inflater.setInput(archive, 10, archive.length - 18)
        def restored = new java.io.ByteArrayOutputStream()
        byte[] buffer = new byte[8192]

        try {
            while (!inflater.finished()) {
                int count
                try {
                    count = inflater.inflate(buffer)
                } catch (java.util.zip.DataFormatException e) {
                    throw new GradleException('GameView DEFLATE stream is corrupt', e)
                }

                if (count > 0) {
                    restored.write(buffer, 0, count)
                    continue
                }
                if (inflater.needsDictionary()) {
                    throw new GradleException('GameView DEFLATE stream requires an unsupported dictionary')
                }
                if (inflater.needsInput()) {
                    break
                }
                throw new GradleException('GameView DEFLATE stream stopped before completion')
            }

            if (!inflater.finished()) {
                throw new GradleException('GameView DEFLATE stream is truncated')
            }
        } finally {
            inflater.end()
        }

        byte[] source = restored.toByteArray()
        String sourceText = new String(source, java.nio.charset.StandardCharsets.UTF_8)
        if (!sourceText.startsWith('package com.alpvz.gardendefense;') ||
                !sourceText.contains('class GameView')) {
            throw new GradleException('Restored GameView source failed Java content validation')
        }

        restoredGameView.parentFile.mkdirs()
        restoredGameView.bytes = source
        println("Restored GameView.java: ${source.length} bytes")
    }
}

tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach {
    dependsOn(restoreGameView)
}
