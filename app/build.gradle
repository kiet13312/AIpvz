plugins {
    id 'com.android.application'
}

android {
    namespace 'com.alpvz.gardendefense'
    compileSdk 35

    defaultConfig {
        applicationId 'com.alpvz.gardendefense'
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName '0.3'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }

        release {
            minifyEnabled false
        }
    }
}

// Restore the compressed engine source before Java compilation.
def compressedGameView = file('src/main/java/com/alpvz/gardendefense/GameView.java.gz')
def restoredGameView = file('src/main/java/com/alpvz/gardendefense/GameView.java')

def restoreGameView = tasks.register('restoreGameView') {
    inputs.file(compressedGameView)
    outputs.file(restoredGameView)

    doLast {
        if (!compressedGameView.exists()) {
            throw new GradleException('Missing compressed GameView.java.gz')
        }

        restoredGameView.parentFile.mkdirs()
        new java.util.zip.GZIPInputStream(new java.io.FileInputStream(compressedGameView)).withCloseable { input ->
            restoredGameView.withOutputStream { output ->
                input.transferTo(output)
            }
        }
    }
}

tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach {
    dependsOn(restoreGameView)
}
