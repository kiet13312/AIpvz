plugins {
    id 'com.android.application'
}

android {
    namespace 'com.alpvz.gardendefense'
    compileSdk 35

    defaultConfig {
        applicationId 'com.alpvz.gardendefense'
        minSdk 23
        targetSdk 35
        versionCode 6
        versionName '0.6'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }

        release {
            minifyEnabled false
        }
    }
}
